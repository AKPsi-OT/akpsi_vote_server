<!DOCTYPE HTML>
<html>
<head>
    <title>Admin Control Panel</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="text/javascript" src="//code.jquery.com/jquery-1.4.2.min.js"></script>
    <script src="https://cdn.socket.io/3.1.3/socket.io.min.js" integrity="sha384-cPwlPLvBTa3sKAgddT6krw0cJat7egBga3DJepJyrLl4Q9/5WLra3rrnMcyTyOnh" crossorigin="anonymous"></script>
    <script type="text/javascript" charset="utf-8">
        var username = '{{ username }}';

        namespace = '/admin'; // change to an empty string
        var socket = io.connect(namespace);
        socket.on('connect', function() {
        });

        $(document).ready(function(){
            socket.on('vote_submitted', function(msg){
                $('#c2').append(msg.name + " submitted their vote.<br>");
                $('#c2').append("Votes Cast: <b>" + msg.votes_cast + "</b>, Votes Left: <b>" + msg.votes_left + "</b><br>");

                if(msg.votes_left < 10){
                    $('#c3').append("----------<br>Not Voted: <b>" + msg.names + "</b><br>");
                }
            });

            socket.on('vote_report', function(msg){
                console.log("Report is:" + msg.report);
                $('#c3').append("----------<br>" + msg.report + "<br>")
            })

            socket.on('receive_not_voted', function(msg){
                $('#c3').append("----------<br>Not Voted: <b>" + msg.names + "</b><br>");
            })

            $('form#start').submit(function(event) {
                var msg = {};
                var custom = $("input[name='custom']:checked").val();
                msg.custom = custom;

                console.log("Custom is " + custom);

                if(custom == "true"){
                    msg.options = $('#options').val();
                    msg.topic = $('#topic').val();
                }else{
                    msg.name = $('#name').val();
                    msg.abstain = $("input[name='abstain']:checked").val();

                    $('#c2').val("<br>Voting on <b>" + msg.name + "</b><br>");
                }

                socket.emit('start_vote', msg);
                return false;
            })

            $('form#end').submit(function(event) {
                socket.emit('end_vote');
                return false;
            })

            $('form#names').submit(function(event) {
                socket.emit('get_not_voted');
                return false;
            })

            // ============================================
            // 🚀 ADD NEW JAVASCRIPT HERE (LOCATION #1)
            // ============================================
            
            // List Voting JavaScript
            $('#upload_list_csv').on('change', function(event){
                var formData = new FormData();
                formData.append('file', this.files[0]);

                $.ajax({
                    url: '/upload_candidate_list',
                    type: 'POST',
                    data: formData,
                    contentType: false,
                    processData: false,
                    success: function(data){
                        $('#list_status').html('<strong>Status:</strong> ' + data.message);
                        displayCandidateList(data.candidates);
                    },
                    error: function(xhr){
                        alert("Error uploading candidate list: " + xhr.responseText);
                    }
                });
            });

            function displayCandidateList(candidates) {
                var html = '<h4>Click a name to start voting:</h4><div class="candidate-grid">';
                
                candidates.forEach(function(candidate, index) {
                    html += '<button class="candidate-btn" onclick="startVoteOnCandidate(\'' + 
                           candidate + '\')">' + candidate + '</button>';
                });
                
                html += '</div>';
                $('#candidate_list_display').html(html);
            }

            window.startVoteOnCandidate = function(candidateName) {
                $('#c2').append("<br><b>LIST VOTE:</b> Starting vote on " + candidateName + "<br>");
                
                socket.emit('start_list_vote', {
                    'name': candidateName,
                    'abstain': 'true'
                });
            }

            // Load existing candidate list on page load
            $.get('/get_candidate_list', function(data) {
                if (data.candidates && data.candidates.length > 0) {
                    $('#list_status').html('<strong>Status:</strong> ' + data.candidates.length + ' candidates loaded');
                    displayCandidateList(data.candidates);
                }
            });

            // ============================================
            // END OF NEW JAVASCRIPT
            // ============================================
            // -----------------------------
            // Catch window closing event and send a socket disconnect event
            window.onbeforeunload = function(){
                socket.emit('disconnect_req');
            }
        });
    </script>
    <!-- ============================================ -->
    <!-- 🚀 ADD NEW CSS HERE (LOCATION #2) -->
    <!-- ============================================ -->
    <style>
        .list-voting-section {
            background-color: #f0f8ff;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 2px solid #4169E1;
        }
        .list-voting-section h3 {
            color: #1e3a8a;
            margin-top: 0;
        }
        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .candidate-btn {
            background: #4169E1;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
        }
        .candidate-btn:hover {
            background: #1e40af;
            transform: translateY(-1px);
        }
        .candidate-btn:active {
            background: #1e3a8a;
            transform: translateY(0);
        }
        #upload_list_csv {
            width: 100%;
            margin-bottom: 10px;
        }
        #list_status {
            color: #1e3a8a;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
    <!-- ============================================ -->
    <!-- END OF NEW CSS -->
    <!-- ============================================ -->

</head>
<body>
    <div id="wrapper">
        <div id="c1">

        </div>

        <div style="width: 100%; display: table;">
            <div style="display: table-row">
                <div id="c1" style="width: 33%; display: table-cell;">
                    <!-- ============================================ -->
                    <!-- 🚀 ADD NEW HTML HERE (LOCATION #3) -->
                    <!-- ============================================ -->
                    <div class="list-voting-section">
                        <h3>📋 List Voting</h3>
                        <p>Upload a CSV and click any name to start voting:</p>
                        
                        <input type="file" id="upload_list_csv" accept=".csv">
                        <div id="list_status">Status: No candidates loaded</div>
                        
                        <div id="candidate_list_display">
                            <!-- Candidate buttons will appear here -->
                        </div>
                    </div>
                    
                    <hr>
                    <!-- ============================================ -->
                    <!-- END OF NEW HTML -->
                    <!-- ============================================ -->
                    <form id="start">
                        <label><b>Vote Type</b></label><br>
                        <label><input type="radio" name="custom" value="true">Custom Vote</label>
                        <label><input type="radio" name="custom" value="false">Bid Night Vote</label> <br />
                        <br>
                        <hr>
                        <br>
                        <label><b>Bid Night Voting</b></label><br>
                        <input type="text" name="name" id="name" placeholder="Rush Name"> <br />
                        <label><input type="radio" name="abstain" value="true">Abstain</label>
                        <label><input type="radio" name="abstain" value="false">No Abstain</label> <br />
                        <br>
                        <hr>
                        <br>
                        <label><b>Custom Voting</b></label><br>
                        <input type="text" name="topic" id="topic" placeholder="Enter voting topic"> <br />
                        <textarea id="options" name="options" rows="4" columns="50" placeholder="Enter voting options (1 per line)"></textarea>
                        <br>
                        <br>
                        <input type="submit" value="Start Vote">
                    </form>
                    <form id="end">
                        <input type="submit" value="End Vote">
                    </form>
                    <form id="names">
                        <input type="submit" value="Get Not Voted">
                    </form>
                </div>

                <div id="c2" style="width: 33%; display: table-cell;overflow-y: scroll;"></div>
                <div id="c3" style="width: 34%; display: table-cell;overflow-y: scroll"></div>
            </div>
        </div>
</body>
</html>
